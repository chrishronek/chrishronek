name: Update latest blog posts

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/blog-posts.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://parakeetdata.com/rss.xml"
          max_post_count: 5
          template: "$newline- [$title]($url) — <sub>$date</sub>"
          date_format: "mmm d, yyyy"
          commit_message: "Update latest blog posts"
          committer_username: "github-actions[bot]"
          committer_email: "41898+github-actions[bot]@users.noreply.github.com"
